packages:
  - 'apps/*'
  - 'packages/*'

# @nestjs/platform-fastify pins an exact `fastify` version internally
# (peer compatibility). Without this override, pnpm resolves a second,
# slightly newer `fastify` for the app's own direct dependency, and the
# two copies' structurally-similar-but-distinct `FastifyInstance` types
# break every fastify plugin's module augmentation (@fastify/cookie,
# @fastify/cors, ...) with a confusing "missing properties" TS error.
# One resolved copy, matching what @nestjs/platform-fastify itself uses,
# avoids the whole class of problem. Bumped 2026-08-28 alongside the
# Nest v10->v11 / Fastify v4->v5 security upgrade (pnpm audit: critical
# @fastify/middie auth-bypass CVE cluster) — 5.11.3 is exactly what
# @nestjs/platform-fastify@11.2.3 itself declares as its `fastify`
# dependency; keep these in lockstep on every future Nest bump.
overrides:
  fastify: 5.11.3
  # Next.js's own optional image-optimization dependency, not used
  # directly by app code anywhere. Pinned past 0.35.0 for the libvips
  # CVE cluster (GHSA-f88m-g3jw-g9cj) flagged by pnpm audit — this app's
  # upload allowlist already made that cluster unreachable (magic-bytes.ts
  # only accepts JPEG/PNG/WEBP), but there's no reason to leave a known-
  # vulnerable version resolved when a compatible patched one exists.
  sharp: ^0.35.4
  # next@15.1.4 hard-pins its OWN internal postcss@8.4.31 for its build
  # pipeline, entirely separate from this workspace's own postcss
  # devDependency (already at a patched 8.5.26 for Tailwind). That
  # internal copy carried 3 CVEs (XSS via unescaped </style>,
  # sourceMappingURL arbitrary file/`.map` read) per pnpm audit. Build-
  # time only, never part of the runtime HTTP surface, but no reason to
  # leave a known-vulnerable copy resolved when 8.5.26 already works.
  postcss: ^8.5.26

# pnpm 10+ refuses to run dependency install/postinstall scripts unless
# explicitly allowed, to limit supply-chain risk from transitive
# dependencies (PRODUCT/docs/09-security.md §15.11). Every package below
# is a direct, deliberately-chosen dependency of this stack and its
# install script is a legitimate native-binary/engine download, not
# arbitrary third-party code:
#   - @nestjs/core: peer-dependency compatibility check
#   - @prisma/client, @prisma/engines, prisma: downloads Prisma's query
#     engine binaries, required for the ORM to function at all
#   - esbuild: downloads its native binary (used transitively by tsx/vitest)
#   - sharp: downloads its native image-processing binary (used by
#     Next.js's built-in image optimization)
#   - unrs-resolver: native module resolver used transitively by ESLint's
#     Next.js config
#   - argon2: downloads its native binary (or builds from source), the
#     password-hashing algorithm this system uses (docs/09-security.md
#     §15.2) — required for password hashing to function at all
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@nestjs/jwt@12.0.1'
